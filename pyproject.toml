[project]
name = "vigil"
version = "0.1.0"
description = "Reachability-aware dependency vulnerability triage with a local LLM"
readme = "README.md"
license = "MIT"
keywords = ["security", "vulnerability", "sca", "reachability", "llm", "static-analysis"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "packaging>=26.3",
    "pydantic>=2.14.3",
    "rich>=15.0.0",
    "typer>=0.28.0",
    "uvicorn>=0.54.0",
]

[project.urls]
Repository = "https://github.com/xmasdev/vigil"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
vigil = "vigil.cli:app"
